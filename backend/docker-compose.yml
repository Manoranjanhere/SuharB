# SugarBf API + Postgres (both run on the same EC2 host)
#
#   .env must have DB_HOST=postgres, DB_SSL=false, and DB_USERNAME / DB_PASSWORD / DB_NAME.
#   POSTGRES_* values are only applied the first time the pgdata volume is created.
#   docker compose up -d --build
#
# Postgres is bound to 127.0.0.1 so it is reachable from the EC2 host but not the internet.

name: sugarbf-backend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sugarbf-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sugarbf-net

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: sugarbf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sugarbf-net

networks:
  sugarbf-net:
    driver: bridge

volumes:
  pgdata:
